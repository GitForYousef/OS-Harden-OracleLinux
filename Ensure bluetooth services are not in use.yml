---
- name: CIS 3.1.3 - Ensure bluetooth services are not in use
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Stop bluetooth service
      ansible.builtin.systemd:
        name: bluetooth.service
        state: stopped
      failed_when: false

    - name: Remove bluez package
      ansible.builtin.dnf:
        name: bluez
        state: absent

    - name: Verify bluez package is absent
      ansible.builtin.command:
        cmd: rpm -q bluez
      register: bluez_package
      changed_when: false
      failed_when: bluez_package.rc == 0

    - name: Verify bluetooth service is not active
      ansible.builtin.command:
        cmd: systemctl is-active bluetooth.service
      register: bluetooth_active
      changed_when: false
      failed_when: false

    - name: Verify bluetooth service is not enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled bluetooth.service
      register: bluetooth_enabled
      changed_when: false
      failed_when: false

    - name: Assert CIS 3.1.3 compliance
      ansible.builtin.assert:
        that:
          - bluez_package.rc != 0
          - bluetooth_active.stdout | trim != "active"
          - bluetooth_enabled.stdout | trim != "enabled"
        success_msg: "CIS 3.1.3 compliant - Bluetooth services are not in use"
        fail_msg: "CIS 3.1.3 is not correctly configured"
