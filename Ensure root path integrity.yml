---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Read root user's PATH
      ansible.builtin.shell:
        cmd: |
          awk -F= '$1 == "PATH" {print substr($0,6)}' /root/.bash_profile /root/.bashrc /root/.profile 2>/dev/null
      register: root_path_files
      changed_when: false

    - name: Remove invalid root PATH entries from root shell files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)(/root/\.local/bin|/root/bin)(?=:|$)'
        replace: '\1'
        backup: true
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Remove duplicate colons from root shell files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'PATH=([^"\n]*):+([^"\n]*)'
        replace: 'PATH=\1:\2'
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Verify root PATH entries
      ansible.builtin.shell:
        cmd: |
          root_path=$(
            for f in /root/.bash_profile /root/.bashrc /root/.profile; do
              if [ -f "$f" ]; then
                grep -hE '^[[:space:]]*(export[[:space:]]+)?PATH=' "$f"
              fi
            done
          )

          echo "$root_path" | grep -oE '/[^:$[:space:]]+' | while read -r dir; do
            [ -d "$dir" ] || {
              echo "FAIL: $dir is not a directory"
              exit 1
            }

            owner=$(stat -c '%U' "$dir")
            mode=$(stat -c '%a' "$dir")

            [ "$owner" = "root" ] || {
              echo "FAIL: $dir is not root owned"
              exit 1
            }

            [ $((8#$mode & 0022)) -eq 0 ] || {
              echo "FAIL: $dir is writable by group/others"
              exit 1
            }
          done

          if echo "$root_path" | grep -Eq '(^|[:=])([.]|:|$)'; then
            echo "FAIL: current/empty PATH entry found"
            exit 1
          fi

          echo "PASS: root PATH integrity verified"
      register: root_path_check
      changed_when: false
      failed_when: root_path_check.rc != 0

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - root_path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - root PATH contains an invalid or insecure entry"
