---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove Oracle Linux user local bin PATH block from root bashrc
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        marker: "# {mark} ANSIBLE CIS ROOT PATH HARDENING"
        state: absent

    - name: Remove direct HOME local bin PATH assignment from root bashrc
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '^[[:space:]]*(export[[:space:]]+)?PATH=["'']?\$HOME/\.local/bin:\$PATH["'']?[[:space:]]*$'
        replace: ''
      failed_when: false

    - name: Remove unsafe HOME local bin PATH assignment from root profile files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^[[:space:]]*(export[[:space:]]+)?PATH=["'']?\$HOME/\.local/bin:\$PATH["'']?[[:space:]]*$'
        replace: ''
      loop:
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Remove root home local bin from existing PATH assignments
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)\$HOME/\.local/bin(:|$)'
        replace: '\1'
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Remove duplicate colons from root PATH assignments
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^[[:space:]]*(?:export[[:space:]]+)?PATH=[^#]*):+'
        replace: '\1'
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Remove trailing colon from root PATH assignments
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^[[:space:]]*(?:export[[:space:]]+)?PATH=[^#]*):[[:space:]]*$'
        replace: '\1'
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Build clean root PATH from a login shell
      ansible.builtin.shell: |
        set -o pipefail

        PATH_VALUE=$(bash -lc 'printf "%s" "$PATH"')

        printf '%s\n' "$PATH_VALUE"
      args:
        executable: /bin/bash
      register: root_path
      changed_when: false

    - name: Verify root PATH integrity
      ansible.builtin.shell: |
        set -u

        path_value="{{ root_path.stdout | trim }}"
        bad=0

        OLDIFS="$IFS"
        IFS=':'

        for dir in $path_value; do

          if [ -z "$dir" ]; then
            echo "FAIL: empty PATH entry"
            bad=1
            continue
          fi

          if [ "$dir" = "." ]; then
            echo "FAIL: current directory '.' in root PATH"
            bad=1
            continue
          fi

          case "$dir" in

            /*)
              if [ ! -d "$dir" ]; then
                echo "FAIL: $dir is not a directory"
                bad=1
                continue
              fi

              owner=$(stat -c '%U' "$dir")
              mode=$(stat -c '%a' "$dir")

              if [ "$owner" != "root" ]; then
                echo "FAIL: $dir is not owned by root"
                bad=1
              fi

              if [ $((8#$mode & 0022)) -ne 0 ]; then
                echo "FAIL: $dir is writable by group/others"
                bad=1
              fi
              ;;

            *)
              echo "FAIL: relative PATH entry '$dir'"
              bad=1
              ;;

          esac

        done

        IFS="$OLDIFS"

        if [ "$bad" -eq 0 ]; then
          echo "PASS: root PATH integrity verified"
          exit 0
        fi

        exit 1
      args:
        executable: /bin/bash
      register: path_check
      changed_when: false

    - name: Display root PATH
      ansible.builtin.debug:
        msg:
          - "Effective root PATH:"
          - "{{ root_path.stdout }}"

    - name: Display PATH verification
      ansible.builtin.debug:
        var: path_check.stdout_lines

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - unsafe root PATH entry detected"
