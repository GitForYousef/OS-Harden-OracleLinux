---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove /root/.local/bin from root PATH
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)/root/\.local/bin(?=:|$)'
        replace: '\1'
        backup: true
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Remove /root/bin from root PATH
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)/root/bin(?=:|$)'
        replace: '\1'
        backup: true
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Clean duplicate colons in root PATH definitions
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'PATH=([^#\n]*):{2,}([^#\n]*)'
        replace: 'PATH=\1:\2'
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Verify root PATH definitions
      ansible.builtin.shell:
        cmd: |
          found=0

          for file in /root/.bash_profile /root/.bashrc /root/.profile; do
            [ -f "$file" ] || continue

            while IFS= read -r line; do
              path_value="${line#*=}"
              path_value="${path_value#\"}"
              path_value="${path_value%\"}"
              path_value="${path_value#\'}"
              path_value="${path_value%\'}"

              OLDIFS="$IFS"
              IFS=':'

              for dir in $path_value; do
                [ -n "$dir" ] || {
                  echo "FAIL: empty PATH entry in $file"
                  exit 1
                }

                [ "$dir" != "." ] || {
                  echo "FAIL: current directory in PATH: $file"
                  exit 1
                }

                case "$dir" in
                  /*)
                    ;;
                  *)
                    echo "FAIL: relative PATH entry: $dir"
                    exit 1
                    ;;
                esac

                [ -d "$dir" ] || {
                  echo "FAIL: $dir is not a directory"
                  exit 1
                }

                owner=$(stat -c '%U' "$dir")
                mode=$(stat -c '%a' "$dir")

                [ "$owner" = "root" ] || {
                  echo "FAIL: $dir is not owned by root"
                  exit 1
                }

                if [ $((8#$mode & 0022)) -ne 0 ]; then
                  echo "FAIL: $dir is writable by group/others"
                  exit 1
                fi
              done

              IFS="$OLDIFS"

            done < <(grep -E '^[[:space:]]*(export[[:space:]]+)?PATH=' "$file" || true)
          done

          echo "PASS: root PATH integrity verified"
      register: root_path_check
      changed_when: false
      failed_when: root_path_check.rc != 0

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - root_path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - root PATH contains an invalid or insecure entry"
