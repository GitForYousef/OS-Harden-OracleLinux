---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove $HOME/.local/bin from root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '(^|:)\$HOME/\.local/bin(:|$)'
        replace: '\1'
        backup: true

    - name: Remove $HOME/bin from root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '(^|:)\$HOME/bin(:|$)'
        replace: '\1'
        backup: true

    - name: Remove /root/.local/bin from root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '(^|:)/root/\.local/bin(:|$)'
        replace: '\1'
        backup: true

    - name: Remove /root/bin from root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '(^|:)/root/bin(:|$)'
        replace: '\1'
        backup: true

    - name: Clean duplicate colons in root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: 'PATH=([^#\n]*):{2,}([^#\n]*)'
        replace: 'PATH=\1:\2'
        backup: true

    - name: Remove trailing colon from root PATH
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: 'PATH=([^#\n]*):[[:space:]]*$'
        replace: 'PATH=\1'
        backup: true

    - name: Verify root PATH integrity
      ansible.builtin.shell:
        cmd: |
          bad=0

          while IFS= read -r line; do
            path_value="${line#*=}"
            path_value="${path_value#\"}"
            path_value="${path_value%\"}"
            path_value="${path_value#\'}"
            path_value="${path_value%\'}"

            OLDIFS="$IFS"
            IFS=':'

            for dir in $path_value; do

              case "$dir" in
                ""|"."|"\$HOME"|"\$HOME/"*|"/root/"*)
                  echo "FAIL: unsafe PATH entry '$dir'"
                  bad=1
                  ;;
              esac

              case "$dir" in
                /*)
                  if [ ! -d "$dir" ]; then
                    echo "FAIL: $dir is not a directory"
                    bad=1
                    continue
                  fi

                  owner=$(stat -c '%U' "$dir")
                  mode=$(stat -c '%a' "$dir")

                  if [ "$owner" != "root" ]; then
                    echo "FAIL: $dir is not root owned"
                    bad=1
                  fi

                  if [ $((8#$mode & 0022)) -ne 0 ]; then
                    echo "FAIL: $dir is writable by group/others"
                    bad=1
                  fi
                  ;;
              esac

            done

            IFS="$OLDIFS"

          done < <(
            grep -E '^[[:space:]]*(export[[:space:]]+)?PATH=' \
              /root/.bashrc /root/.bash_profile /root/.profile \
              /etc/profile /etc/bashrc /etc/profile.d/*.sh \
              2>/dev/null || true
          )

          if [ "$bad" -eq 0 ]; then
            echo "PASS: root PATH integrity verified"
            exit 0
          fi

          exit 1
      register: root_path_check
      changed_when: false
      failed_when: root_path_check.rc != 0

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - root_path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - root PATH still contains an invalid entry"
