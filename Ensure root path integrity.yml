---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove unsafe HOME local bin block from root bashrc
      ansible.builtin.replace:
        path: /root/.bashrc
        regexp: '(?ms)^# User specific environment\nif ! \[\[ "\$PATH" =~ "\$HOME/\.local/bin::" \]\]\nthen\n\s*PATH="\$HOME/\.local/bin:\$PATH"\nfi\nexport PATH\n'
        replace: '# User specific environment\n'
        backup: true

    - name: Remove direct unsafe HOME local bin PATH entries from root startup files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)("\$HOME/\.local/bin"|''\$HOME/\.local/bin''|\$HOME/\.local/bin)'
        replace: ''
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Remove empty PATH entries from root startup files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:):+'
        replace: '\1'
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Remove trailing colon from PATH assignments
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^[[:space:]]*(?:export[[:space:]]+)?PATH=.*):[[:space:]]*$'
        replace: '\1'
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /root/.profile
      failed_when: false

    - name: Verify root PATH integrity
      ansible.builtin.shell: |
        bad=0

        for file in \
          /root/.bashrc \
          /root/.bash_profile \
          /root/.profile \
          /etc/profile \
          /etc/bashrc \
          /etc/profile.d/*.sh; do

          [ -f "$file" ] || continue

          while IFS= read -r line; do

            path_value="${line#*=}"

            path_value="${path_value#\"}"
            path_value="${path_value%\"}"
            path_value="${path_value#\'}"
            path_value="${path_value%\'}"

            OLDIFS="$IFS"
            IFS=':'

            for dir in $path_value; do

              case "$dir" in
                "")
                  echo "FAIL: empty PATH entry in $file"
                  bad=1
                  ;;

                ".")
                  echo "FAIL: current directory in PATH in $file"
                  bad=1
                  ;;

                "\$HOME"|"\$HOME/"*|"/root/"*)
                  echo "FAIL: unsafe PATH entry '$dir' in $file"
                  bad=1
                  ;;

                /*)
                  if [ ! -d "$dir" ]; then
                    echo "FAIL: $dir is not a directory"
                    bad=1
                    continue
                  fi

                  owner=$(stat -c '%U' "$dir")
                  mode=$(stat -c '%a' "$dir")

                  if [ "$owner" != "root" ]; then
                    echo "FAIL: $dir is not root owned"
                    bad=1
                  fi

                  if [ $((8#$mode & 0022)) -ne 0 ]; then
                    echo "FAIL: $dir is writable by group/others"
                    bad=1
                  fi
                  ;;

                *)
                  echo "FAIL: relative PATH entry '$dir' in $file"
                  bad=1
                  ;;
              esac

            done

            IFS="$OLDIFS"

          done < <(
            grep -E '^[[:space:]]*(export[[:space:]]+)?PATH=' \
              "$file" 2>/dev/null || true
          )

        done

        if [ "$bad" -eq 0 ]; then
          echo "PASS: root PATH integrity verified"
          exit 0
        fi

        exit 1
      register: path_check
      changed_when: false

    - name: Display PATH verification result
      ansible.builtin.debug:
        msg: "{{ path_check.stdout_lines }}"

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - unsafe root PATH entries remain"
