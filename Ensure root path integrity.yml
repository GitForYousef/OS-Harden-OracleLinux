---
- name: CIS 5.4.2.5 - Ensure root path integrity
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove unsafe root PATH entries
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(^|:)(\$HOME/\.local/bin|\$HOME/bin|/root/\.local/bin|/root/bin)(?=:|$)'
        replace: '\1'
        backup: true
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Remove duplicate colons from root PATH
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'PATH=([^#\n]*):{2,}([^#\n]*)'
        replace: 'PATH=\1:\2'
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Remove trailing colon from root PATH
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'PATH=([^#\n]*):([[:space:]]*(#.*)?)$'
        replace: 'PATH=\1\2'
      loop:
        - /root/.bash_profile
        - /root/.bashrc
        - /root/.profile
      when: item is file

    - name: Verify root PATH integrity
      ansible.builtin.shell:
        cmd: |
          for file in /root/.bash_profile /root/.bashrc /root/.profile; do
            [ -f "$file" ] || continue

            grep -E '^[[:space:]]*(export[[:space:]]+)?PATH=' "$file" | while IFS= read -r line; do

              path_value="${line#*=}"
              path_value="${path_value#\"}"
              path_value="${path_value%\"}"
              path_value="${path_value#\'}"
              path_value="${path_value%\'}"

              OLDIFS="$IFS"
              IFS=':'

              for dir in $path_value; do

                [ -n "$dir" ] || {
                  echo "FAIL: empty PATH entry in $file"
                  exit 1
                }

                [ "$dir" != "." ] || {
                  echo "FAIL: current directory in PATH"
                  exit 1
                }

                case "$dir" in
                  /*)
                    ;;
                  *)
                    echo "FAIL: relative or unresolved PATH entry: $dir"
                    exit 1
                    ;;
                esac

                [ -d "$dir" ] || {
                  echo "FAIL: $dir is not a directory"
                  exit 1
                }

                owner=$(stat -c '%U' "$dir")
                mode=$(stat -c '%a' "$dir")

                [ "$owner" = "root" ] || {
                  echo "FAIL: $dir is not owned by root"
                  exit 1
                }

                if [ $((8#$mode & 0022)) -ne 0 ]; then
                  echo "FAIL: $dir is writable by group or others"
                  exit 1
                fi

              done

              IFS="$OLDIFS"

            done
          done

          echo "PASS: root PATH integrity verified"
      register: root_path_check
      changed_when: false
      failed_when: root_path_check.rc != 0

    - name: Assert CIS 5.4.2.5 compliance
      ansible.builtin.assert:
        that:
          - root_path_check.rc == 0
        success_msg: "CIS 5.4.2.5 compliant - root PATH integrity verified"
        fail_msg: "CIS 5.4.2.5 failed - root PATH contains an invalid or insecure entry"
