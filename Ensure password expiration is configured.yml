---
- name: CIS 5.4.1.1 - Ensure password expiration is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure PASS_MAX_DAYS in login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS\s+'
        line: 'PASS_MAX_DAYS 365'
        state: present
        backup: true

    - name: Find local users with passwords exceeding 365 days
      ansible.builtin.shell: |
        awk -F: '($2 ~ /^\$.+\$/) && ($5 > 365 || $5 < 1) {print $1}' /etc/shadow
      register: users_needing_expiration_fix
      changed_when: false

    - name: Configure password maximum age for local password users
      ansible.builtin.command:
        cmd: "chage --maxdays 365 {{ item }}"
      loop: "{{ users_needing_expiration_fix.stdout_lines }}"
      when:
        - users_needing_expiration_fix.stdout_lines | length > 0
      register: chage_result
      changed_when: true

    - name: Verify PASS_MAX_DAYS configuration
      ansible.builtin.shell: |
        awk '$1 == "PASS_MAX_DAYS" && $2 == "365" {found=1} END {exit(found ? 0 : 1)}' /etc/login.defs
      register: login_defs_check
      changed_when: false
      failed_when: false

    - name: Verify shadow password maximum age
      ansible.builtin.shell: |
        awk -F: '
        ($2 ~ /^\$.+\$/) && ($5 > 365 || $5 < 1) {
          print "Non-compliant user: " $1 " PASS_MAX_DAYS=" $5
          bad=1
        }
        END {
          if (bad) exit 1
          else exit 0
        }' /etc/shadow
      register: shadow_check
      changed_when: false
      failed_when: false

    - name: Assert CIS 5.4.1.1 compliance
      ansible.builtin.assert:
        that:
          - login_defs_check.rc == 0
          - shadow_check.rc == 0
        success_msg: "CIS 5.4.1.1 compliant - PASS_MAX_DAYS is 365 and local password users are compliant"
        fail_msg: "CIS 5.4.1.1 failed - password expiration is not configured correctly"
