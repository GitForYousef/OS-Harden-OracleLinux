- name: CIS 7.2.9 - Ensure local interactive user dot files access is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Get local interactive users
      ansible.builtin.shell: |
        awk -F: '
        BEGIN {
          while ((getline line < "/etc/shells") > 0) {
            if (line !~ /^[[:space:]]*#/ &&
                line !~ /\/nologin$/ &&
                line ~ /^\//) {
              shells[line] = 1
            }
          }
          close("/etc/shells")
        }
        {
          if (($7 in shells) && ($6 != "") && ($6 != "/")) {
            print $1 ":" $6
          }
        }' /etc/passwd
      register: interactive_users
      changed_when: false

    - name: Display local interactive users
      ansible.builtin.debug:
        var: interactive_users.stdout_lines

    - name: Find dot files in interactive user home directories
      ansible.builtin.shell: |
        home="{{ item.split(':', 1)[1] }}"

        if [ -d "$home" ]; then
          find "$home" -xdev -type f -name '.*' -print
        fi
      loop: "{{ interactive_users.stdout_lines }}"
      register: user_dot_files
      changed_when: false
      loop_control:
        label: "{{ item }}"

    - name: Fix dot file permissions and ownership
      ansible.builtin.shell: |
        user="{{ item.item.split(':', 1)[0] }}"
        home="{{ item.item.split(':', 1)[1] }}"
        group="$(id -gn "$user")"
        changed=0

        if [ ! -d "$home" ]; then
          exit 0
        fi

        while IFS= read -r -d '' file; do
          base="$(basename "$file")"
          before="$(stat -c '%a:%U:%G' "$file")"

          case "$base" in

            .forward|.rhost)
              continue
              ;;

            .netrc|.bash_history)
              chmod u-x,go-rwx "$file"
              chown "$user:$group" "$file"
              ;;

            *)
              chmod u-x,go-wx "$file"
              chown "$user:$group" "$file"
              ;;

          esac

          after="$(stat -c '%a:%U:%G' "$file")"

          if [ "$before" != "$after" ]; then
            changed=1
          fi

        done < <(find "$home" -xdev -type f -name '.*' -print0)

        if [ "$changed" -eq 1 ]; then
          echo "CHANGED"
        fi
      loop: "{{ user_dot_files.results }}"
      register: dot_file_remediation
      changed_when: "'CHANGED' in dot_file_remediation.stdout"
      loop_control:
        label: "{{ item.item }}"

    - name: Find .forward and .rhost files
      ansible.builtin.shell: |
        home="{{ item.split(':', 1)[1] }}"

        if [ -d "$home" ]; then
          find "$home" -xdev -type f \
            \( -name '.forward' -o -name '.rhost' \) \
            -print
        fi
      loop: "{{ interactive_users.stdout_lines }}"
      register: forward_rhost_files
      changed_when: false
      loop_control:
        label: "{{ item }}"

    - name: Report .forward and .rhost files
      ansible.builtin.debug:
        msg: |
          WARNING - Manual review required.
          User/Home: {{ item.item }}
          Files:
          {{ item.stdout }}
      loop: "{{ forward_rhost_files.results }}"
      when:
        - item.stdout | trim | length > 0
      loop_control:
        label: "{{ item.item }}"

    - name: Verify dot files with excessive permissions
      ansible.builtin.shell: |
        find /home -xdev -type f -name '.*' -perm /0133 -printf '%m %u %g %p\n'
      register: permission_check
      changed_when: false
      failed_when: false

    - name: Display permission verification
      ansible.builtin.debug:
        msg: >-
          {{
            permission_check.stdout_lines
            if permission_check.stdout_lines | length > 0
            else ['PASS - No dot files with excessive permissions found']
          }}

    - name: Verify dot file ownership
      ansible.builtin.shell: |
        awk -F: '
        BEGIN {
          while ((getline line < "/etc/shells") > 0) {
            if (line !~ /^[[:space:]]*#/ &&
                line !~ /\/nologin$/ &&
                line ~ /^\//) {
              shells[line] = 1
            }
          }
          close("/etc/shells")
        }
        {
          if (($7 in shells) && ($6 != "") && ($6 != "/")) {
            print $1 ":" $6
          }
        }' /etc/passwd |
        while IFS=: read -r user home; do
          [ -d "$home" ] || continue

          primary_group="$(id -gn "$user")"

          find "$home" -xdev -type f -name '.*' \
            ! -name '.forward' \
            ! -name '.rhost' \
            -printf '%u:%g:%p\n' |
          while IFS=: read -r owner group file; do
            if [ "$owner" != "$user" ] || [ "$group" != "$primary_group" ]; then
              echo "$owner:$group:$file (expected $user:$primary_group)"
            fi
          done
        done
      register: ownership_check
      changed_when: false
      failed_when: false

    - name: Display ownership verification
      ansible.builtin.debug:
        msg: >-
          {{
            ownership_check.stdout_lines
            if ownership_check.stdout_lines | length > 0
            else ['PASS - Dot file ownership is correctly configured']
          }}
