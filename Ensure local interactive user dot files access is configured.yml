---
- name: CIS 7.2.9 - Ensure local interactive user dot files access is configured
  hosts: all
  become: true
  gather_facts: false

  vars:
    max_dot_file_users: 1000

  tasks:

    # ------------------------------------------------------------
    # Determine valid interactive shells
    # Any shell in /etc/shells that is NOT nologin is considered
    # an interactive/valid shell.
    # ------------------------------------------------------------

    - name: Get valid interactive shells
      ansible.builtin.shell: |
        awk -F/ '$NF != "nologin" {print}' /etc/shells
      register: valid_shells_result
      changed_when: false

    - name: Build valid shell list
      ansible.builtin.set_fact:
        valid_shells: "{{ valid_shells_result.stdout_lines | default([]) }}"


    # ------------------------------------------------------------
    # Get local users whose shell is one of the valid shells.
    #
    # We deliberately use /etc/passwd rather than getent so that
    # AD/LDAP users are not included.
    # ------------------------------------------------------------

    - name: Get local interactive users
      ansible.builtin.shell: |
        awk -F: '
        BEGIN {
          n = split("{{ valid_shells | join("|") }}", shells, "|")
        }
        {
          for (i = 1; i <= n; i++) {
            if ($7 == shells[i]) {
              print $1 ":" $6
            }
          }
        }' /etc/passwd
      register: interactive_users_result
      changed_when: false


    - name: Display local interactive users
      ansible.builtin.debug:
        msg: "{{ interactive_users_result.stdout_lines }}"


    # ------------------------------------------------------------
    # Find all hidden files in each interactive user's home.
    #
    # -xdev prevents crossing into another filesystem.
    # This matches the CIS remediation script.
    # ------------------------------------------------------------

    - name: Find dot files in interactive user home directories
      ansible.builtin.find:
        paths: "{{ item.split(':')[1] }}"
        patterns: ".*"
        file_type: file
        recurse: true
        excludes: ""
        use_regex: false
      loop: "{{ interactive_users_result.stdout_lines }}"
      register: dot_files_result
      when:
        - item.split(':') | length == 2
        - item.split(':')[1] | length > 0
        - item.split(':')[1] != "/"
      loop_control:
        label: "{{ item }}"


    # ------------------------------------------------------------
    # Remove group/other write and execute permissions from
    # normal dot files.
    #
    # CIS:
    #   l_mask='0133'
    #   l_change="u-x,go-wx"
    #
    # Maximum resulting permission = 0644
    # ------------------------------------------------------------

    - name: Secure normal dot files to maximum 0644
      ansible.builtin.file:
        path: "{{ item.1.path }}"
        mode: "0644"
      loop: "{{ query('subelements', dot_files_result.results, 'files') }}"
      when:
        - item.1.path | basename not in ['.forward', '.rhost', '.netrc', '.bash_history']
      loop_control:
        label: "{{ item.1.path }}"


    # ------------------------------------------------------------
    # .netrc
    #
    # CIS:
    #   l_mask='0177'
    #   l_change="u-x,go-rwx"
    #
    # Maximum resulting permission = 0600
    # ------------------------------------------------------------

    - name: Secure .netrc files
      ansible.builtin.file:
        path: "{{ item.1.path }}"
        mode: "0600"
      loop: "{{ query('subelements', dot_files_result.results, 'files') }}"
      when:
        - item.1.path | basename == '.netrc'
      loop_control:
        label: "{{ item.1.path }}"


    # ------------------------------------------------------------
    # .bash_history
    #
    # CIS:
    #   l_mask='0177'
    #   l_change="u-x,go-rwx"
    #
    # Maximum resulting permission = 0600
    # ------------------------------------------------------------

    - name: Secure .bash_history files
      ansible.builtin.file:
        path: "{{ item.1.path }}"
        mode: "0600"
      loop: "{{ query('subelements', dot_files_result.results, 'files') }}"
      when:
        - item.1.path | basename == '.bash_history'
      loop_control:
        label: "{{ item.1.path }}"


    # ------------------------------------------------------------
    # Correct ownership of dot files.
    #
    # Every dot file must be owned by the corresponding user and
    # the user's primary group.
    # ------------------------------------------------------------

    - name: Get primary group for each interactive user
      ansible.builtin.shell: |
        id -gn "{{ item.split(':')[0] }}"
      loop: "{{ interactive_users_result.stdout_lines }}"
      register: user_primary_groups
      changed_when: false
      when:
        - item.split(':') | length == 2
      loop_control:
        label: "{{ item.split(':')[0] }}"


    - name: Correct ownership of dot files
      ansible.builtin.file:
        path: "{{ item.1.path }}"
        owner: "{{ item.0.item.split(':')[0] }}"
        group: "{{ user_primary_groups.results[item.0_index].stdout | trim }}"
      loop: >-
        {{
          dot_files_result.results
          | zip(range(0, dot_files_result.results | length))
          | list
          | map('list')
          | list
          | subelements('0.files')
        }}
      when: false
      loop_control:
        label: "{{ item.1.path }}"


    # ------------------------------------------------------------
    # Ownership remediation.
    #
    # The previous task is intentionally not used because Ansible's
    # nested loop indexing is unnecessarily complex.
    #
    # Instead process each user separately.
    # ------------------------------------------------------------

    - name: Process ownership for each interactive user's dot files
      block:

        - name: Get primary group
          ansible.builtin.command:
            cmd: id -gn "{{ user_item.split(':')[0] }}"
          register: primary_group
          changed_when: false

        - name: Find dot files for ownership remediation
          ansible.builtin.find:
            paths: "{{ user_item.split(':')[1] }}"
            patterns: ".*"
            file_type: file
            recurse: true
          register: ownership_dot_files
          when:
            - user_item.split(':')[1] != "/"

        - name: Set dot file ownership
          ansible.builtin.file:
            path: "{{ dot_file.path }}"
            owner: "{{ user_item.split(':')[0] }}"
            group: "{{ primary_group.stdout | trim }}"
          loop: "{{ ownership_dot_files.files | default([]) }}"
          loop_control:
            loop_var: dot_file
            label: "{{ dot_file.path }}"

      loop: "{{ interactive_users_result.stdout_lines }}"
      loop_control:
        loop_var: user_item
        label: "{{ user_item }}"


    # ------------------------------------------------------------
    # .forward and .rhost
    #
    # CIS specifically says these should be investigated and
    # manually deleted.
    #
    # We DO NOT delete them automatically.
    # ------------------------------------------------------------

    - name: Find .forward and .rhost files
      ansible.builtin.find:
        paths: "{{ item.split(':')[1] }}"
        patterns:
          - ".forward"
          - ".rhost"
        file_type: file
        recurse: true
      loop: "{{ interactive_users_result.stdout_lines }}"
      register: dangerous_dot_files
      when:
        - item.split(':') | length == 2
        - item.split(':')[1] != "/"
      loop_control:
        label: "{{ item }}"


    - name: Report .forward and .rhost files for manual review
      ansible.builtin.debug:
        msg:
          - "WARNING: Review and manually remove this file if not required:"
          - "{{ item.1.path }}"
      loop: "{{ query('subelements', dangerous_dot_files.results, 'files') }}"
      when:
        - dangerous_dot_files.results | length > 0
      loop_control:
        label: "{{ item.1.path }}"


    # ------------------------------------------------------------
    # Final verification - files with excessive permissions
    # ------------------------------------------------------------

    - name: Find dot files with group/other write or execute permissions
      ansible.builtin.shell: |
        find /home -xdev -type f -name '.*' \
          \( -perm /0133 \) \
          -printf '%m %u %g %p\n'
      register: remaining_dot_permission_findings
      changed_when: false
      failed_when: false


    - name: Display remaining dot file permission findings
      ansible.builtin.debug:
        msg: >-
          {{
            remaining_dot_permission_findings.stdout_lines
            if remaining_dot_permission_findings.stdout_lines | length > 0
            else ['PASS - No dot files with excessive permissions found under /home']
          }}
