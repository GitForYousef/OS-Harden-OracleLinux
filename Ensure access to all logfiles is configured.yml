---
- name: CIS 6.2.4.1 - Ensure access to all logfiles is configured
  hosts: all
  become: true
  gather_facts: true

  vars:
    log_directory: /var/log

  tasks:

    # ------------------------------------------------------------
    # 1. Find all files under /var/log that have:
    #    - permissions more permissive than allowed
    #    - non-root ownership
    #    - non-root group ownership
    # ------------------------------------------------------------
    - name: Find log files requiring permission/ownership remediation
      ansible.builtin.shell: |
        find -L {{ log_directory }} -type f \
          \( -perm /0137 -o ! -user root -o ! -group root \) \
          -print
      register: logfile_list
      changed_when: false

    - name: Display files identified for remediation
      ansible.builtin.debug:
        msg: "{{ logfile_list.stdout_lines }}"
      when: logfile_list.stdout_lines | length > 0


    # ------------------------------------------------------------
    # 2. Determine UID_MIN
    # ------------------------------------------------------------
    - name: Get UID_MIN from login.defs
      ansible.builtin.shell: |
        awk '/^\s*UID_MIN/{print $2}' /etc/login.defs
      register: uid_min_result
      changed_when: false

    - name: Set UID_MIN
      ansible.builtin.set_fact:
        uid_min: "{{ uid_min_result.stdout | trim | int }}"


    # ------------------------------------------------------------
    # 3. Collect file information
    # ------------------------------------------------------------
    - name: Collect logfile metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ logfile_list.stdout_lines }}"
      register: logfile_stats
      when: logfile_list.stdout_lines | length > 0


    # ------------------------------------------------------------
    # 4. Remediate logfile permissions
    #
    # CIS general requirement:
    #   u-x,g-wx,o-rwx
    #
    # This results in maximum permissions of 0640 for regular
    # log files.
    # ------------------------------------------------------------
    - name: Set regular logfile permissions to 0640
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0640"
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - >
          (
            item.item | basename not in
            [
              'lastlog',
              'wtmp',
              'btmp',
              'secure',
              'auth.log',
              'syslog',
              'messages',
              'SSSD',
              'sssd',
              'gdm',
              'gdm3'
            ]
          )
      loop_control:
        label: "{{ item.item }}"


    # ------------------------------------------------------------
    # 5. Special files:
    #
    # lastlog / wtmp / btmp
    # Maximum permissions: 0664
    # Owner: root
    # Group: root or utmp
    # ------------------------------------------------------------
    - name: Set permissions for lastlog/wtmp/btmp files
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0664"
        owner: root
        group: root
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - >
          (
            item.item | basename == 'lastlog' or
            item.item | basename is match('^lastlog\\.') or
            item.item | basename == 'wtmp' or
            item.item | basename is match('^wtmp[.-]') or
            item.item | basename == 'btmp' or
            item.item | basename is match('^btmp[.-]')
          )
      loop_control:
        label: "{{ item.item }}"


    # ------------------------------------------------------------
    # 6. secure/auth.log/syslog/messages
    #
    # Owner: root
    # Group: root or adm
    # Maximum permissions: 0640
    # ------------------------------------------------------------
    - name: Secure standard system logs
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0640"
        owner: root
        group: root
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - item.item | basename in
          ['secure', 'auth.log', 'syslog', 'messages']
      loop_control:
        label: "{{ item.item }}"


    # ------------------------------------------------------------
    # 7. SSSD logs
    #
    # Owner: root or SSSD
    # Group: root or SSSD
    # Maximum permissions: 0640
    # ------------------------------------------------------------
    - name: Secure SSSD log files
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0640"
        owner: root
        group: root
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - item.item | basename in ['SSSD', 'sssd']
      loop_control:
        label: "{{ item.item }}"


    # ------------------------------------------------------------
    # 8. systemd journal files
    #
    # Owner: root
    # Group: systemd-journal
    # Maximum permissions: 0640
    # ------------------------------------------------------------
    - name: Secure systemd journal files
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0640"
        owner: root
        group: systemd-journal
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - >
          (
            item.item | basename is match('.*\.journal$') or
            item.item | basename is match('.*\.journal~$')
          )
      loop_control:
        label: "{{ item.item }}"


    # ------------------------------------------------------------
    # 9. GDM logs
    #
    # Owner: root
    # Group: root
    # Maximum permissions: 0640
    # ------------------------------------------------------------
    - name: Secure GDM log files
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: "0640"
        owner: root
        group: root
      loop: "{{ logfile_stats.results }}"
      when:
        - logfile_list.stdout_lines | length > 0
        - item.stat.exists
        - item.stat.isreg
        - item.item | basename in ['gdm', 'gdm3']
      loop_control:
        label: "{{ item.item }}"


    # ----
