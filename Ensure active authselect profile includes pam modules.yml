---
- name: CIS 5.3.2.1 - Ensure active authselect profile includes pam modules
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Get active authselect profile
      ansible.builtin.command:
        cmd: authselect current -r
      register: authselect_profile_raw
      changed_when: false

    - name: Extract authselect profile name
      ansible.builtin.set_fact:
        authselect_profile: "{{ authselect_profile_raw.stdout | trim | regex_search('^custom/[^[:space:]]+') }}"

    - name: Display active authselect profile
      ansible.builtin.debug:
        msg:
          - "Full authselect output: {{ authselect_profile_raw.stdout | trim }}"
          - "Profile: {{ authselect_profile }}"

    - name: Verify custom authselect profile is active
      ansible.builtin.assert:
        that:
          - authselect_profile is not none
          - authselect_profile != ''
        fail_msg: >-
          Could not determine the active custom authselect profile.
          Full output: {{ authselect_profile_raw.stdout | trim }}
        success_msg: >-
          Active custom authselect profile:
          {{ authselect_profile }}

    - name: Set authselect profile path
      ansible.builtin.set_fact:
        authselect_profile_path: "/etc/authselect/{{ authselect_profile }}"

    - name: Verify authselect system-auth template exists
      ansible.builtin.stat:
        path: "{{ authselect_profile_path }}/system-auth"
      register: system_auth_template

    - name: Verify authselect password-auth template exists
      ansible.builtin.stat:
        path: "{{ authselect_profile_path }}/password-auth"
      register: password_auth_template

    - name: Assert authselect templates exist
      ansible.builtin.assert:
        that:
          - system_auth_template.stat.exists
          - password_auth_template.stat.exists
        fail_msg: >-
          Required authselect template files are missing from
          {{ authselect_profile_path }}
        success_msg: >-
          Authselect system-auth and password-auth templates exist.

    - name: Backup system-auth template
      ansible.builtin.copy:
        src: "{{ authselect_profile_path }}/system-auth"
        dest: "{{ authselect_profile_path }}/system-auth.cis-backup"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Backup password-auth template
      ansible.builtin.copy:
        src: "{{ authselect_profile_path }}/password-auth"
        dest: "{{ authselect_profile_path }}/password-auth.cis-backup"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Add pam_faillock authfail to system-auth template
      ansible.builtin.lineinfile:
        path: "{{ authselect_profile_path }}/system-auth"
        regexp: '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+authfail\b'
        line: 'auth        required      pam_faillock.so authfail'
        insertafter: '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+preauth\b'
        state: present
      register: system_auth_changed

    - name: Add pam_faillock authfail to password-auth template
      ansible.builtin.lineinfile:
        path: "{{ authselect_profile_path }}/password-auth"
        regexp: '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+authfail\b'
        line: 'auth        required      pam_faillock.so authfail'
        insertafter: '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+preauth\b'
        state: present
      register: password_auth_changed

    - name: Display authselect template pam_faillock configuration
      ansible.builtin.shell: |
        echo "===== SYSTEM-AUTH TEMPLATE ====="
        grep -nE 'pam_faillock\.so' "{{ authselect_profile_path }}/system-auth" || true

        echo
        echo "===== PASSWORD-AUTH TEMPLATE ====="
        grep -nE 'pam_faillock\.so' "{{ authselect_profile_path }}/password-auth" || true
      args:
        executable: /bin/bash
      register: template_check
      changed_when: false

    - name: Show template configuration
      ansible.builtin.debug:
        msg: "{{ template_check.stdout_lines }}"

    - name: Apply authselect changes
      ansible.builtin.command:
        cmd: authselect apply-changes
      register: authselect_apply
      when:
        - system_auth_changed.changed or password_auth_changed.changed

    - name: Verify system-auth generated PAM configuration
      ansible.builtin.shell: |
        grep -nE '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+authfail\b' /etc/pam.d/system-auth
      args:
        executable: /bin/bash
      register: system_auth_verify
      changed_when: false
      failed_when: false

    - name: Verify password-auth generated PAM configuration
      ansible.builtin.shell: |
        grep -nE '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_faillock\.so[[:space:]]+authfail\b' /etc/pam.d/password-auth
      args:
        executable: /bin/bash
      register: password_auth_verify
      changed_when: false
      failed_when: false

    - name: Display generated PAM configuration
      ansible.builtin.debug:
        msg:
          - "system-auth: {{ system_auth_verify.stdout_lines }}"
          - "password-auth: {{ password_auth_verify.stdout_lines }}"

    - name: Assert CIS 5.3.2.1 compliance
      ansible.builtin.assert:
        that:
          - system_auth_verify.rc == 0
          - password_auth_verify.rc == 0
        success_msg: >-
          CIS 5.3.2.1 compliant -
          pam_faillock authfail is present in both system-auth and password-auth.
        fail_msg: >-
          CIS 5.3.2.1 FAILED -
          pam_faillock authfail is missing from one or both PAM files.
