---
- name: CIS 5.3.2.1 - Ensure active authselect profile includes pam modules
  hosts: all
  become: true
  gather_facts: false

  tasks:

    # ------------------------------------------------------------
    # 1. Get active authselect profile
    # ------------------------------------------------------------
    - name: Get active authselect profile
      ansible.builtin.command:
        cmd: authselect current -r
      register: authselect_profile_raw
      changed_when: false

    # ------------------------------------------------------------
    # 2. Extract only the profile name
    #
    # Example actual output:
    # custom/oci-default with-faillock with-smartcard with-pwhistory
    #
    # We only want:
    # custom/oci-default
    # ------------------------------------------------------------
    - name: Extract authselect profile name
      ansible.builtin.set_fact:
        authselect_profile: "{{ authselect_profile_raw.stdout | trim | split() | first }}"

    # ------------------------------------------------------------
    # 3. Display detected profile
    # ------------------------------------------------------------
    - name: Display active authselect profile
      ansible.builtin.debug:
        msg:
          - "Full authselect output: {{ authselect_profile_raw.stdout | trim }}"
          - "Profile: {{ authselect_profile }}"

    # ------------------------------------------------------------
    # 4. Verify that a custom profile is active
    # ------------------------------------------------------------
    - name: Verify custom authselect profile is active
      ansible.builtin.assert:
        that:
          - authselect_profile is defined
          - authselect_profile | length > 0
          - authselect_profile is match('^custom/')
        fail_msg: >-
          Could not determine a valid custom authselect profile.
          Full output:
          {{ authselect_profile_raw.stdout | trim }}
        success_msg: >-
          Active custom authselect profile detected:
          {{ authselect_profile }}

    # ------------------------------------------------------------
    # 5. Set profile path
    # ------------------------------------------------------------
    - name: Set authselect profile path
      ansible.builtin.set_fact:
        authselect_profile_path: "/etc/authselect/{{ authselect_profile }}"

    # ------------------------------------------------------------
    # 6. Display profile path
    # ------------------------------------------------------------
    - name: Display authselect profile path
      ansible.builtin.debug:
        msg: "Authselect profile path: {{ authselect_profile_path }}"

    # ------------------------------------------------------------
    # 7. Verify system-auth template exists
    # ------------------------------------------------------------
    - name: Verify system-auth template exists
      ansible.builtin.stat:
        path: "{{ authselect_profile_path }}/system-auth"
      register: system_auth_template

    # ------------------------------------------------------------
    # 8. Verify password-auth template exists
    # ------------------------------------------------------------
    - name: Verify password-auth template exists
      ansible.builtin.stat:
        path: "{{ authselect_profile_path }}/password-auth"
      register: password_auth_template

    # ------------------------------------------------------------
    # 9. Assert template files exist
    # ------------------------------------------------------------
    - name: Assert authselect template files exist
      ansible.builtin.assert:
        that:
          - system_auth_template.stat.exists
          - password_auth_template.stat.exists
        fail_msg: >-
          One or more authselect template files are missing under
          {{ authselect_profile_path }}
        success_msg: >-
          system-auth and password-auth templates exist under
          {{ authselect_profile_path }}

    # ------------------------------------------------------------
    # 10. Check PAM modules in system-auth
    # ------------------------------------------------------------
    - name: Check PAM modules in system-auth
      ansible.builtin.shell: |
        grep -P '^\s*(auth|account|password|session)\s+.*pam_(unix|pwquality|pwhistory|faillock)\.so' \
        "{{ authselect_profile_path }}/system-auth" || true
      register: system_auth_modules
      changed_when: false

    # ------------------------------------------------------------
    # 11. Check PAM modules in password-auth
    # ------------------------------------------------------------
    - name: Check PAM modules in password-auth
      ansible.builtin.shell: |
        grep -P '^\s*(auth|account|password|session)\s+.*pam_(unix|pwquality|pwhistory|faillock)\.so' \
        "{{ authselect_profile_path }}/password-auth" || true
      register: password_auth_modules
      changed_when: false

    # ------------------------------------------------------------
    # 12. Display current PAM module configuration
    # ------------------------------------------------------------
    - name: Display current PAM module configuration
      ansible.builtin.debug:
        msg:
          - "===== system-auth ====="
          - "{{ system_auth_modules.stdout_lines }}"
          - "===== password-auth ====="
          - "{{ password_auth_modules.stdout_lines }}"

    # ------------------------------------------------------------
    # 13. Ensure pam_faillock authfail exists in system-auth
    # ------------------------------------------------------------
    - name: Add pam_faillock authfail to system-auth template
      ansible.builtin.lineinfile:
        path: "{{ authselect_profile_path }}/system-auth"
        insertafter: '^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*$'
        line: 'auth        required      pam_faillock.so authfail'
        state: present
        backup: true
      register: system_auth_faillock

    # ------------------------------------------------------------
    # 14. Ensure pam_faillock authfail exists in password-auth
    # ------------------------------------------------------------
    - name: Add pam_faillock authfail to password-auth template
      ansible.builtin.lineinfile:
        path: "{{ authselect_profile_path }}/password-auth"
        insertafter: '^\s*auth\s+required\s+pam_faillock\.so\s+preauth.*$'
        line: 'auth        required      pam_faillock.so authfail'
        state: present
        backup: true
      register: password_auth_faillock

    # ------------------------------------------------------------
    # 15. Apply authselect changes if templates changed
    # ------------------------------------------------------------
    - name: Apply authselect changes
      ansible.builtin.command:
        cmd: authselect apply-changes
      when:
        - system_auth_faillock.changed or password_auth_faillock.changed

    # ------------------------------------------------------------
    # 16. Verify generated system-auth
    # ------------------------------------------------------------
    - name: Verify pam_faillock authfail in generated system-auth
      ansible.builtin.shell: |
        grep -Pq '^\s*auth\s+(required|requisite)\s+.*pam_faillock\.so\s+.*authfail\b' \
        /etc/pam.d/system-auth
      register: system_auth_verify
      changed_when: false
      failed_when: false

    # ------------------------------------------------------------
    # 17. Verify generated password-auth
    # ------------------------------------------------------------
    - name: Verify pam_faillock authfail in generated password-auth
      ansible.builtin.shell: |
        grep -Pq '^\s*auth\s+(required|requisite)\s+.*pam_faillock\.so\s+.*authfail\b' \
        /etc/pam.d/password-auth
      register: password_auth_verify
      changed_when: false
      failed_when: false

    # ------------------------------------------------------------
    # 18. Display verification
    # ------------------------------------------------------------
    - name: Display pam_faillock verification
      ansible.builtin.debug:
        msg:
          - "system-auth pam_faillock authfail return code: {{ system_auth_verify.rc }}"
          - "password-auth pam_faillock authfail return code: {{ password_auth_verify.rc }}"

    # ------------------------------------------------------------
    # 19. Final CIS compliance assertion
    # ------------------------------------------------------------
    - name: Assert CIS 5.3.2.1 compliance
      ansible.builtin.assert:
        that:
          - system_auth_verify.rc == 0
          - password_auth_verify.rc == 0
        fail_msg: >-
          CIS 5.3.2.1 FAILED - pam_faillock authfail is missing
          from one or both generated PAM configuration files.
        success_msg: >-
          CIS 5.3.2.1 COMPLIANT - pam_faillock authfail is present
          in both system-auth and password-auth.
